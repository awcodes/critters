name: JS

# Repo-local until the shared awcodes/.github workflow gains a JavaScript job: it only
# runs PHP tests, lint, static analysis and reformat (see ci.yml). Critters' runtime is
# JavaScript, so its unit and real-browser tests run here.

on:
  push:
    branches:
      - 1.x
    paths:
      - "resources/**"
      - "src/**"
      - "tests/js/**"
      - "tests/browser/**"
      - "workbench/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - "composer.json"
      - "vitest.config.js"
      - "playwright.config.js"
      - "testbench.yaml"
      - ".github/workflows/js.yml"
  pull_request:
    branches:
      - 1.x
    paths:
      - "resources/**"
      - "src/**"
      - "tests/js/**"
      - "tests/browser/**"
      - "workbench/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - "composer.json"
      - "vitest.config.js"
      - "playwright.config.js"
      - "testbench.yaml"
      - ".github/workflows/js.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Fleet composite action: sets up Node and runs `npm ci`.
      - name: Setup Node
        uses: awcodes/.github/actions/setup-node@v1

      - name: Run unit tests
        run: npm test

      # resources/dist is committed (Filament publishes it from the package), so it must
      # match the sources exactly.
      - name: Check the committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- resources/dist

  browser:
    name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup PHP
        uses: awcodes/.github/actions/setup-php@v1
        with:
          php-version: "8.4"

      - name: Install dependencies
        uses: awcodes/.github/actions/install-dependencies@v1

      - name: Setup Node
        uses: awcodes/.github/actions/setup-node@v1

      - name: Build the package and the Workbench
        run: |
          npm run build
          vendor/bin/testbench workbench:build --ansi
          npm run build:workbench

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

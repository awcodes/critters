laravel: '@testbench'

providers:
  - Awcodes\Critters\CrittersServiceProvider
  - Workbench\App\Providers\Filament\AdminPanelProvider
  - Workbench\App\Providers\Filament\ClassicPanelProvider
  - Workbench\App\Providers\Filament\PlainPanelProvider
  - Workbench\App\Providers\Filament\AquariumPanelProvider
  - Workbench\App\Providers\Filament\CustomPanelProvider
  - Workbench\App\Providers\Filament\ZooPanelProvider

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

env:
  - AUTH_MODEL='Workbench\App\Models\User'

workbench:
  start: '/admin'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: true
  build:
    - filament-assets
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
